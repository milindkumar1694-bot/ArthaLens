# ====================================================================
# ARTHALENS — RENDER DEPLOYMENT BLUEPRINT
# ====================================================================

services:

  # ------------------------------------------------------------------
  # BACKEND
  # ------------------------------------------------------------------
  - type: web
    name: arthalens-backend
    runtime: python
    rootDir: backend

    buildCommand: pip install -r requirements.txt

    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /api/v1/health

    envVars:
      - key: APP_NAME
        value: ArthaLens

      - key: APP_ENV
        value: production

      - key: DEBUG
        value: "false"

      - key: API_PREFIX
        value: /api/v1

      - key: DATA_MODE
        value: live

      - key: BROKER_PROVIDER
        value: angelone

      - key: CORS_ORIGINS
        sync: false

      - key: ANGEL_ONE_API_KEY
        sync: false

      - key: ANGEL_ONE_CLIENT_ID
        sync: false

      - key: ANGEL_ONE_PASSWORD
        sync: false

      - key: ANGEL_ONE_TOTP
        sync: false

      - key: DATABASE_URL
        fromDatabase:
          name: arthalens-db
          property: connectionString

      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: arthalens-redis
          property: connectionString

  # ------------------------------------------------------------------
  # FRONTEND
  # ------------------------------------------------------------------
  - type: web
    name: arthalens-frontend
    runtime: static

    rootDir: frontend

    buildCommand: npm install && npm run build

    staticPublishPath: dist

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      - key: VITE_API_BASE_URL
        sync: false

  # ------------------------------------------------------------------
  # REDIS-COMPATIBLE KEY VALUE
  # ------------------------------------------------------------------
  - type: keyvalue
    name: arthalens-redis
    plan: 256mb
    ipAllowList: []

databases:

  # ------------------------------------------------------------------
  # POSTGRESQL
  # ------------------------------------------------------------------
  - name: arthalens-db
    databaseName: arthalens
    user: arthalens_user
    plan: free
